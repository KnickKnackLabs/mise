name: KKL release

on:
  push:
    tags: ["v*-kkl.*"]

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.repository == 'KnickKnackLabs/mise'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64

          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify release version
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-kkl\.[0-9]+$ ]]; then
            echo "Invalid fork release tag: $TAG" >&2
            exit 1
          fi

          version="$(sh scripts/get-version.sh)"

          if [[ "$TAG" != "$version" ]]; then
            echo "Tag $TAG differs from Cargo version $version" >&2
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup target add --toolchain 1.95 "${{ matrix.target }}"

      - name: Build
        run: |
          cargo +1.95 build \
            --locked \
            --release \
            --bin mise \
            --target "${{ matrix.target }}" \
            --no-default-features \
            --features rustls-native-roots,vfox/vendored-lua,openssl/vendored

      - name: Package
        run: |
          set -euo pipefail

          binary="target/${{ matrix.target }}/release/mise"
          "${binary}" --version

          mkdir -p package/mise/bin dist
          cp "${binary}" package/mise/bin/mise
          cp LICENSE README.md package/mise/

          tar -czf "dist/mise-${TAG}-${{ matrix.platform }}.tar.gz" \
            -C package mise

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mise-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mise-*
          merge-multiple: true
          path: dist

      - name: Publish release
        working-directory: dist

        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

        run: |
          set -euo pipefail

          sha256sum ./*.tar.gz > SHA256SUMS

          gh release create "${TAG}" \
            --verify-tag \
            --prerelease \
            --title "Mise ${TAG} (KKL fork)" \
            --notes "KKL fork." \
            ./*.tar.gz SHA256SUMS
